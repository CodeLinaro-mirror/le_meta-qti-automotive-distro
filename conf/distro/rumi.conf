require conf/distro/auto.conf

DISTRO_NAME = "rumi"

DISTRO_FEATURES:append = " \
    qti-rumi \
"
DISTRO_FEATURES:remove:gen5 = " \
    qti-avb \
    selinux \
"
MACHINE_FEATURES:remove = "\
    qti-bluetooth \
    qti-multimedia \
    qti-cv \
    qti-display \
    qti-graphics \
    qti-audio-aw \
    qti-camera \
    qti-safety \
    qti-vnw \
    early-ramdisk-init \
    qti-security \
    qti-vmm \
    qti-compute-platform \
"

KERNEL_CMD_PARAMS = "rw rootwait nokaslr console=ttyMSM0,115200n8 earlycon=qcom_geni,0x884000 clk_ignore_unused kpti=0 cpuidle.off=1 loglevel=8 printk.devkmsg=on console_msg_format=syslog log_buf_len=256K"

IMAGE_FEATURES:append = " debug-tweaks"

KERNEL_ARCH = "gen5auto"

KERNEL_MACHINE_DTB = "\
    arch/arm64/boot/dts/qcom/seca-rumi.dtb \
"

OOT_DTBS = "\
    arch/arm64/boot/dts/qcom/seca-overlay.dtbo \
"

OOT_DDR_DTBOS = "\
"

EARLY_RAMDISK_KERNEL_MODULES = "\
"