require conf/distro/include/auto-common.inc

DISTRO_NAME = "auto gvm"

DISTRO_FEATURES:append = " \
    qti-adsp \
    qti-audio \
    qti-audio-ar \
    qti-audio-awe \
    qti-camera \
    qti-cdsp \
    qti-cdsp1 \
    qti-core \
    qti-data \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-tools \
    qti-avb \
    qti-fde \
    qti-fastcv \
    ab-boot-support \
"

DISTRO_FEATURES:remove:gvm-gen5 = "\
    qti-audio \
    qti-audio-ar \
"

DISTRO_FEATURES:remove:qclinux-gvm-gen5 = "\
    qti-audio \
    qti-audio-ar \
    qti-multimedia \
    qti-display \
    qti-camera \
"

DISTRO_FEATURES:remove:gvm-gen4-5 = "\
    qti-adsp \
    qti-audio \
    qti-audio-ar \
    qti-camera \
    qti-cdsp \
    qti-cdsp1 \
    qti-display \
    qti-graphics \
    qti-multimedia \
    qti-security \
    qti-vnw \
    qti-fastcv \
"

# Video
DISTRO_FEATURES:append:gvm-gen5 = " qti-codec2 qti-gstdeinterlace"

# Camera
DISTRO_FEATURES:append:gvm-gen5 = " qti-qcx"

# Switch package format to rpm for GVM
PACKAGE_CLASSES = "package_rpm"
